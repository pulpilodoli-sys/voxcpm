name: Desktop checks and packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          echo 'C:\ProgramData\chocolatey\bin' >> $env:GITHUB_PATH
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -e ".[test,build,local]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build unsigned desktop package
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: DramaScript-${{ matrix.os }}-unsigned
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
