[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dramascript"
version = "0.2.0"
description = "长视频转中文剧情剧本桌面工作台"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "python-docx>=1.1,<2"]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2", "av>=11,<17"]
vision = ["transformers>=4.57,<5", "torch>=2.6,<3", "torchvision>=0.21,<1", "Pillow>=10,<13"]
build = ["pyinstaller>=6.12,<7"]
test = ["pytest>=8,<10", "Pillow>=10,<13"]

[project.gui-scripts]
dramascript = "dramascript.app:main"

[tool.setuptools.packages.find]
where = ["src"]
